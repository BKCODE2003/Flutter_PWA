name: Deploy Flutter Web

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # This gives Dart 3.7.2
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: taskverse

      - name: Build web release
        run: flutter build web --release --base-href="/taskverse/"
        working-directory: taskverse

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: taskverse/build/web
